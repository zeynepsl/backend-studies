# Application Configuration
spring.application.name=weather-api
server.port=8080

# Weather API Configuration
# Get your free API key from: https://openweathermap.org/api
weather.api.api-key=${WEATHER_API_KEY:your_api_key_here}
weather.api.base-url=https://api.openweathermap.org/data/2.5
weather.api.units=metric
weather.api.language=tr

# Logging Configuration
logging.level.root=INFO
logging.level.com.weatherapi=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Spring Boot Actuator (optional)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
